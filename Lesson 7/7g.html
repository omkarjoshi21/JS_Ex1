<!DOCTYPE html>
<html>
  <head>
    <title>7g problem</title>
  </head>
  <body>
    <script>
      function convertLength(length, from, to) {
        if (from === 'km' && to === 'miles') {
          return `${length / 1.6} miles`;
        } else if (from === 'miles' && to === 'km') {
          return `${length * 1.6} km`;
        }

      }

      console.log(convertLength(2, 'miles', 'km'));
      console.log(convertLength(40, 'km', 'miles'));
      
    </script>
  </body>
</html>
