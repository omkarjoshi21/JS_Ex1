<!DOCTYPE html>
<html>
    <head>
        <title>7f problem</title>
    </head>
    <body>
        <script>
            
            function convertTempreture(Celcius,ch) {
                if (ch == 'c') {
                     return (Celcius *9/5)+32
                }
                else if (ch == 'f') {
                    return (Celcius - 32) * 5/9
                }
            }
            console.log(convertTempreture(25,'c'))
            console.log(convertTempreture(86,'f'))

        </script>
    </body>
</html>
