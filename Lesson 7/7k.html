<!DOCTYPE html>
<html>

<head>
    <title>5h problem</title>
</head>

<body>
    <button onclick="
            console.log(`Cart quantity :${cartquantity}`)
            ">Show Quantity
    </button>

    <button onclick="
            updateCartQuantity(1)
            
        ">Add to cart
    </button>

    <button onclick="
        updateCartQuantity(2)
        ">+2
    </button>

    <button onclick="
        updateCartQuantity(3)
        ">+3
    </button>
    <button onclick="
        updateCartQuantity(4)
        ">+4
    </button>

    <button onclick="
        updateCartQuantity(5)
        ">+5
    </button>

    <button onclick="
        updateCartQuantity(-1)
        
        ">Remove From the cart
    </button>

    <button onclick="
       updateCartQuantity(-2)
        ">-2
    </button>
    <button onclick="
        updateCartQuantity(-3)
        ">-3
    </button>
    <button onclick="cartquantity = 0">Reset cart</button>

    <script>
        let cartquantity = 0;
        function updateCartQuantity(change) {
            if (cartquantity + change > 10) {
            alert('The cart is full');

            } else if (cartquantity + change < 0) {
            alert('Not enough items in the cart');

            } else {
            cartquantity += change;
            console.log(`Cart quantity: ${cartquantity}`);
            }
        }
    </script>
</body>

</html>
